<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Used iPad Value Comparer</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script defer src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/10.7.1/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script defer src="app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>iPad Value Scorer</h1>
            <p>Find the best bang for your buck.</p>
        </header>
        
        <main>
            <div class="card">
                <div class="input-group">
                    <label for="model-select">iPad Model</label>
                    <select id="model-select" disabled>
                        <option value="">Loading models...</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="price-input">Price ($)</label>
                    <input type="number" id="price-input" placeholder="e.g. 300" min="0" step="1">
                </div>
                
                <button id="calculate-btn">Calculate Value</button>
            </div>
            
            <div id="result-area" class="result-card hidden">
                <h2>Value Score</h2>
                <div class="score-display">
                    <span id="score-value">--</span>
                    <span class="score-label">Points / Dollar</span>
                </div>
                <div id="context-msg">Higher is better!</div>
                <div class="details">
                    <p>Geekbench Score: <span id="gb-score">--</span></p>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Data scraped from Geekbench Browser daily.</p>
        </footer>
    </div>
</body>
</html>
