name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install
        working-directory: scripts
        run: npm ci --ignore-scripts
      - name: Unit tests
        working-directory: scripts
        run: npm test
      - name: Validate catalog against previous version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          prev="$RUNNER_TEMP/previous-catalog.json"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            ref="origin/$BASE_REF"
          else
            ref="HEAD~1"
          fi
          # The file may not exist in the previous revision (first commit); then skip --previous.
          if git rev-parse --verify -q "$ref" >/dev/null && git show "$ref:public/catalog.json" > "$prev" 2>/dev/null; then
            node scripts/validate.js public/catalog.json --previous "$prev"
          else
            echo "No previous public/catalog.json at $ref; validating without --previous"
            node scripts/validate.js public/catalog.json
          fi

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOSTING }}
          channelId: live
          projectId: ipad-compare

  alert:
    needs: [test, deploy]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.test.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Ping healthchecks and open issue
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$HEALTHCHECKS_URL" ]; then
            printf 'CI/deploy failed on main: %s\n' "$run_url" | curl -fsS -m 10 --retry 3 --data-binary @- "$HEALTHCHECKS_URL/fail" || echo "healthchecks fail ping failed (ignored)"
          else
            echo "HEALTHCHECKS_URL not set; skipping ping"
          fi
          gh label create auto-update --force --color ededed --description "Automated catalog updates and alerts" || true
          printf 'CI or deploy failed on main.\n\nRun: %s\n' "$run_url" > alert-body.md
          gh issue create --label auto-update --title "Deploy failed $(date -u +%Y-%m-%d)" --body-file alert-body.md
