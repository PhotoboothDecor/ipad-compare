name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install
        working-directory: scripts
        run: npm ci
      - name: Unit tests
        working-directory: scripts
        run: npm test
      - name: Validate catalog against previous version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          prev="$RUNNER_TEMP/previous-catalog.json"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            ref="origin/$BASE_REF"
          else
            ref="HEAD~1"
          fi
          # The file may not exist in the previous revision (first commit); then skip --previous.
          if git rev-parse --verify -q "$ref" >/dev/null && git show "$ref:public/catalog.json" > "$prev" 2>/dev/null; then
            node scripts/validate.js public/catalog.json --previous "$prev"
          else
            echo "No previous public/catalog.json at $ref; validating without --previous"
            node scripts/validate.js public/catalog.json
          fi

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOSTING }}
          channelId: live
          projectId: ipad-compare
