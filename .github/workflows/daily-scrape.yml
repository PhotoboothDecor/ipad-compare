name: Daily Geekbench Scrape

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd scripts
          npm install

      - name: Run Apple Scraper (model numbers + max OS)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts
          node scrape_apple.js

      - name: Install curl-impersonate
        run: |
          curl -sL -o /tmp/curl-impersonate.tar.gz \
            https://github.com/lexiforest/curl-impersonate/releases/download/v1.5.6/curl-impersonate-v1.5.6.x86_64-linux-gnu.tar.gz
          sudo tar -xzf /tmp/curl-impersonate.tar.gz -C /usr/local/bin/
          sudo chmod +x /usr/local/bin/curl-impersonate /usr/local/bin/curl_chrome* /usr/local/bin/curl_ff* /usr/local/bin/curl_safari* /usr/local/bin/curl_edge* 2>/dev/null || true
          curl_chrome131 --version | head -1

      - name: Run Geekbench Scraper (scores + self-healing)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts
          node scrape.js

      - name: Auto-commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/model_mapping.json public/model_specs.json
          if git diff --cached --quiet; then
            echo "No data file changes to commit"
          else
            git commit -m "chore(auto-update): sync model data [skip ci]"
            git push
          fi
